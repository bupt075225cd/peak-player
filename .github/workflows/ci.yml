name: CI

# 推送到 GitHub 时触发；PR 与手动触发同样生效
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 已在仓库内配置好钩子，CI 不需要再安装 git hooks
  HUSKY: '0'

jobs:
  build:
    name: lint / test / build / package (windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ffmpeg 二进制不进仓库，缓存下来避免每次重新下载 80MB
      - name: Cache ffmpeg binary
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: ffmpeg-${{ runner.os }}-b6.1.1

      - name: Install dependencies
        run: npm ci

      # 与 .husky/pre-push 一致：静态检查 → 覆盖率与基线 → 编译；
      # Windows 安装包只在 CI 里打
      - name: Static check (tsc + vue-tsc)
        run: npm run lint

      # scripts/run-tests.mjs 用 ELECTRON_RUN_AS_NODE 跑 vitest，
      # 与 install-app-deps 重建后的 better-sqlite3 ABI 一致
      - name: Unit tests with coverage
        run: npm run test:coverage

      # 与本地钩子同一份基线（scripts/coverage-baseline.json），
      # 任一模块低于基线即让 job 失败
      - name: Check coverage baseline
        run: npm run check:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn

      - name: Build (electron-vite)
        run: npm run build

      # 直接在构建产物上跑真实 Electron（复用上一步的 out/，不重复构建）。
      # Windows runner 有桌面会话，不需要 xvfb；Linux 上需 `xvfb-run -a npm run test:e2e`。
      # 失败时保留 trace 便于回放：npx playwright show-trace <trace.zip>
      - name: E2E (Playwright + Electron)
        run: npx playwright test

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Package Windows installer
        run: npm run package:win

      # package:win 末尾已含一次冒烟；这里显式再跑一次，避免脚本被改动后漏校验。
      # 校验内容：包内 resources/bin/ffmpeg.exe 存在、体积正常、可执行且带 rubberband。
      - name: Verify packaged ffmpeg
        run: npm run check:package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: peak-player-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
