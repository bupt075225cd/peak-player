appId: com.peakplayer.app
productName: Peak Player
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - resources/**/*
  - '!resources/bin/**'
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
npmRebuild: true
# ffmpeg 需以真实文件形式落盘（asar 内的二进制无法 spawn）
extraResources:
  - from: resources/bin
    to: bin
win:
  target:
    - nsis
  icon: resources/icon.png
mac:
  target:
    - dmg
  category: public.app-category.music
linux:
  target:
    - AppImage
  category: Audio
  icon: resources/icon.png
