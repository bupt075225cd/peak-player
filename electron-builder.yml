appId: com.peakplayer.app
productName: Peak Player
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - resources/**/*
  - '!resources/bin/**'
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
npmRebuild: true
# 安装包只通过 CI artifact 分发。CI 环境下 electron-builder 默认会尝试
# 发布到 GitHub Release，缺 GH_TOKEN 时直接让打包失败（exit code 1）。
publish: null
# ffmpeg 需以真实文件形式落盘（asar 内的二进制无法 spawn）
extraResources:
  - from: resources/bin
    to: bin
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  # 向导式安装：允许用户选择安装目录
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 默认装到当前用户目录，无需管理员权限
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Peak Player
mac:
  target:
    - dmg
  category: public.app-category.music
linux:
  target:
    - AppImage
  category: Audio
  icon: resources/icon.png
